appId: click.annotated.desktop
productName: annotated
directories:
  output: release
files:
  - dist/**/*
  - electron/**/*
  - package.json
  # scripts/write-oauth-config.mjs writes this before packing. It is gitignored
  # because it may hold a client secret, so name it here as well as via electron/**/*.
  - electron/oauth.json
  - "!electron/oauth.local.json"
  - "!electron/**/*.test.mjs"
asar: true
# scripts/stage-engine.mjs copies crunchcalld into native/stage before pack.
# An empty stage is fine; the sidecar then reports engine_missing until a binary is built.
extraResources:
  - from: native/stage
    to: .
    filter:
      - '**/*'
publish:
  provider: github
  owner: keithsimkin
  repo: crunchcall
win:
  # Multi-size ICO (16–256). Embedded into annotated.exe so the taskbar,
  # installer, and shortcuts never fall back to the Electron atom.
  icon: electron/icon.ico
  # Stable GitHub Releases / annotated.click asset name (no spaces).
  artifactName: ${productName}-Setup-${version}.${ext}
  # CSC_LINK and CSC_KEY_PASSWORD sign the installer. electron-updater then
  # rejects an update whose Authenticode publisher does not match this build.
  target:
    - nsis
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  shortcutName: annotated
  uninstallDisplayName: annotated
