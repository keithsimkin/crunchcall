<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="annotated — local-first AI notepad for meetings. Notes stay on this PC."
    />
    <!-- Fonts ship with the app via CSS @font-face (no Google Fonts network). -->
    <style>
      /* Paint the shell before the JS bundle so Electron's first frame isn't blank. */
      html,
      body,
      #root {
        margin: 0;
        min-height: 100%;
        background: #0c0c0e;
      }
      html[data-theme='light'],
      html[data-theme='light'] body,
      html[data-theme='light'] #root {
        background: #f0f0ec;
      }
    </style>
    <title>annotated</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        try {
          const preference = localStorage.getItem('crunchcall.theme') || 'system'
          const dark =
            preference === 'dark' ||
            (preference !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          const theme = dark ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch {
          document.documentElement.dataset.theme = 'dark'
          document.documentElement.style.colorScheme = 'dark'
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
