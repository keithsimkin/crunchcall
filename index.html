<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CrunchCall — crunch every call. Local-first AI notepad for meetings."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Sans+3:ital,wght@0,400..800;1,400..700&family=Source+Serif+4:opsz,wght@8..60,400..600&display=swap"
      rel="stylesheet"
    />
    <title>CrunchCall</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        try {
          const preference = localStorage.getItem('crunchcall.theme') || 'system'
          const dark =
            preference === 'dark' ||
            (preference !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          const theme = dark ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch {
          document.documentElement.dataset.theme = 'dark'
          document.documentElement.style.colorScheme = 'dark'
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
